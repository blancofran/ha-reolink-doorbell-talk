name: Feature request
description: Suggest an improvement or a new option
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For questions or open-ended ideas, [Discussions](https://github.com/blancofran/ha-reolink-doorbell-talk/discussions) is a better place. Use this form for a concrete request.
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: input
    id: doorbell
    attributes:
      label: Your doorbell model (optional)
      description: Helps to know whether the request depends on the model.
